<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        max-width: 64rem;
        margin: 0 auto;
        padding: 2rem clamp(1rem, 4vw, 3rem);
        font: 1rem/1.65 system-ui, sans-serif;
        color: #24292f;
        background: #fff;
        overflow-wrap: anywhere;
      }
      a { color: #0969da; text-underline-offset: .15em; }
      a:hover { text-decoration-thickness: .15em; }
      h1, h2, h3, h4 { line-height: 1.3; scroll-margin-top: 1rem; }
      h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); }
      h2 { margin-top: 2.5rem; padding-bottom: .4rem; border-bottom: 1px solid #d0d7de; }
      h3 { margin-top: 1.75rem; }
      li { margin: .55rem 0; }
      ul { padding-left: 1.5rem; }
      img { max-width: 100%; height: auto; }
      details { padding: 1rem; border: 1px solid #d0d7de; border-radius: .5rem; }
      summary { cursor: pointer; font-weight: 600; }
      blockquote { margin-left: 0; padding-left: 1rem; border-left: .25rem solid #d0d7de; }
      pre { overflow-x: auto; padding: 1rem; background: #f6f8fa; }
      code { font-size: .9em; }
      @media (prefers-color-scheme: dark) {
        body { color: #e6edf3; background: #0d1117; }
        a { color: #79c0ff; }
        h2, details, blockquote { border-color: #30363d; }
        pre { background: #161b22; }
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
