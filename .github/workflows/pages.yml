name: Publish README to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - LICENSE
      - .github/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare README as the homepage
        shell: bash
        run: |
          mkdir -p _pages
          cp -R .github/pages/. _pages/
          cp LICENSE _pages/LICENSE
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md').read_text(encoding='utf-8')
          Path('_pages/index.md').write_text(
              '---\nlayout: default\n---\n\n' + readme,
              encoding='utf-8',
          )
          PY

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site

      - name: Check homepage and licence
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/LICENSE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
